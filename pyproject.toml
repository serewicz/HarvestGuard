[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harvestguard"
# Keep in step with `__version__` in harvestguard_version.py, which is what the
# CLI's `--version` and the Markdown report both report at runtime. setuptools reads
# this literal statically at build time, so the two are separate declarations;
# tests/test_release_identity.py fails if they drift.
version = "0.1.0"
description = "Open-source cryptographic asset inventory and evidence-collection tool for technology due diligence."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Timothy Serewicz" }]
requires-python = ">=3.10"

[project.scripts]
harvestguard = "harvestguard:main"

# NOTE: This project isn't packaged for PyPI distribution yet. This file
# centralizes dev-tooling config and exposes a local editable-install CLI entry
# point for development use.

# The repository uses a flat layout with several top-level modules and
# packages, so setuptools' automatic discovery refuses to guess (it errors with
# "Multiple top-level packages discovered in a flat-layout", which broke the
# `pip install -e .` path documented in docs/CLI.md). What the CLI needs is
# declared explicitly instead. The Streamlit dashboard (`main.py`,
# `dashboard/`) is deliberately not packaged: it is run with
# `streamlit run main.py` from the repository root, not through an install.
[tool.setuptools]
py-modules = [
    "harvestguard",
    "harvestguard_version",
    "findings",
    "finding_adapters",
    "reports",
]

[tool.setuptools.packages.find]
include = ["analyzer*", "classifier*", "code_analysis*", "scanner*"]

[tool.setuptools.package-data]
code_analysis = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
